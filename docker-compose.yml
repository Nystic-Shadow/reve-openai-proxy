version: '3.8'

services:
  reve-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reve-openai-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-5674}:${PORT:-5674}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5674}
      - HOST=0.0.0.0
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-5674}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
